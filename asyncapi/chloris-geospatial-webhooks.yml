description: Chloris Geospatial provides a webhook that is triggered when a site (reporting unit) is ready.
events:
- event: reportingUnit
  description: Called with a POST request containing a JSON body with type "reportingUnit" and data about the organization, reporting unit, and
    timestamps when the analysis (and optionally export) are completed.
delivery:
  signature: X-Signature header containing an HMAC‑SHA256 hash of the signing secret plus the raw request body
  content_type: application/json
note: The signing secret is a random string chosen when registering the webhook URL in the Chloris Platform UI.
