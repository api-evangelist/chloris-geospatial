aid: chloris-geospatial

name: Chloris Geospatial

image: https://images.prismic.io/chloris/Qrser6mS2HOIqkgk_HeroOption2.png?auto=format,compress

description: Chloris Geospatial provides annual forest biomass and carbon data through a geospatial platform. Their service offers high‑resolution
  (30 m) forest carbon intelligence, covering over 120 million hectares worldwide, with data dating back to 2000. This enables corporations, investors,
  and carbon project developers to assess, monitor, and verify forest carbon projects with MRV‑ready outputs.

