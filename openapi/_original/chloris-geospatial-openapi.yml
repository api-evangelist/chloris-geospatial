# x-archived-from: chloris-geospatial-openapi.yml
# x-archived-on: 2026-10-08
openapi: 3.0.3
info:
  title: Chloris Platform API
  description: API for interacting with the Chloris Platform. All methods require
    an Authorization header with a valid id_token unless otherwise noted. See
    [Authentication](01-getting-started.html#authentication) for details.
  version: 1.4.1
  contact:
    name: Chloris Platform team
    email: help@chloris.earth
servers:
  - url: https://app.chloris.earth/api
paths:
  /info:
    get:
      summary: Retrieve API info that may be used by clients. Does not require
        authentication.
      operationId: getInfo
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  awsCognitoIdentityPoolId:
                    type: string
                    description: The AWS Cognito Identity Pool ID
                  awsRegion:
                    type: string
                    description: The AWS region
                  awsUserPoolsId:
                    type: string
                    description: The AWS Cognito User Pool ID
                  awsUserPoolsWebClientId:
                    type: string
                    description: The AWS Cognito User Pool Web Client ID
                  awsUserFilesS3Bucket:
                    type: string
                    description: The AWS S3 bucket for user files
  /organization:
    post:
      operationId: listOrganizations
      summary: Retrieve organization entries or update an organization's options.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/organization"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizationEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization/usage:
    post:
      operationId: listOrganizationUsage
      summary: Retrieve organization usage reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                periodId:
                  type: string
                  description: period ID, typically the year followed by either the ISO 8601 week
                    number or month number
                  example: 12341234-1234-1234-1234-123412341234
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
                nextToken:
                  type: string
                  description: Token used for pagination. Omitted if there are no more results.
                  example: 12341234-1234-1234-1234-123412341234
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  nextToken:
                    type: string
                    description: Token used for pagination. Omitted if there are no more results.
                  usageReports:
                    type: array
                    items:
                      $ref: "#/components/schemas/organizationUsageReport"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reportingUnit:
    put:
      operationId: putReportingUnit
      summary: Create or update a reporting unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/reportingUnit"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/reportingUnitEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: listReportingUnits
      summary: Retrieve one or more reporting unit entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-public:
                - organizationId
                - reportingUnitId
                - limit
                - nextToken
                - branches
                - historical
                - searchLabel
                - maxPages
              properties:
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
                reportingUnitId:
                  type: string
                  description: reporting unit UUID, omit to list all reporting units
                  example: 12341234-1234-1234-1234-123412341234
                limit:
                  type: integer
                  description: The maximum number of reporting units to scan per page. When
                    searchLabel is set this also caps each page of the filtered
                    scan; capped at 1000.
                  example: 100
                nextToken:
                  type: string
                  description: Token used for list pagination. Omit to start at the beginning.
                  example: 12341234-1234-1234-1234-123412341234
                branches:
                  type: boolean
                  description: Whether to list reporting unit aggregation branches
                  example: true
                historical:
                  type: boolean
                  description: Whether to list previous versions of reporting units. May be used
                    with reportingUnitId to list historical versions for a
                    specific reporting unit.
                  example: true
                drafts:
                  type: boolean
                  description: Whether to list draft versions of reporting units. May be used with
                    reportingUnitId to list drafts for a specific reporting
                    unit.
                  example: true
                filterReportingUnitIds:
                  type: array
                  description: Filter the list of reporting units to only include these
                    reportingUnitIDs. May not be used with historical or drafts.
                  example:
                    - 12341234-1234-1234-1234-123412341234
                    - 12341234-1234-1234-1234-123412341234
                  items:
                    type: string
                  maxItems: 100
                searchLabel:
                  type: string
                  description: Substring to filter reporting units by label (case-sensitive).
                    Results are returned sorted by analysisCompletedAt
                    descending, with non-completed sites at the bottom. May not
                    be used with drafts or historical.
                  example: Restoration
                maxPages:
                  type: integer
                  description: When searchLabel is set, the maximum number of internal scan pages
                    to consume per request. Each page reads up to `limit` items
                    from the table before filtering. Defaults to 5, capped at
                    50. Increase to widen the per-request scan budget for sparse
                    matches in large organizations; follow the response
                    nextToken to retrieve subsequent pages.
                  example: 5
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - description: A list of reporting unit entries
                    properties:
                      reportingUnits:
                        type: array
                        items:
                          $ref: "#/components/schemas/reportingUnitEntry"
                      nextToken:
                        type: string
                        description: Token used for pagination. Omitted if there are no more results.
                  - description: A [reporting unit, control reporting unit] pair
                    type: array
                    items:
                      $ref: "#/components/schemas/reportingUnitEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteReportingUnit
      summary: Archive an existing reporting unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
                reportingUnitId:
                  type: string
                  description: reporting unit UUID
                  example: 12341234-1234-1234-1234-123412341234
                refund:
                  type: boolean
                  description: Whether to refund the area used by this reporting unit. Only valid
                    for non-versioned reporting units.
                  example: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    description: message
                    example: Site deleted
        "403":
          $ref: "#/components/responses/Forbidden"
  /mgrsTiles:
    get:
      operationId: getMgrsTilesFromBoundary
      summary: List MGRS tile ids that overlap a given boundary specified by a GeoJSON
        file hosted on S3
      parameters:
        - name: upload_id
          in: query
          required: false
          schema:
            type: string
            description: Path to the boundary file upload, must point to a GeoJSON file in a
              Chloris S3 bucket
            example: s3://path/to/geojson
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  tile_ids:
                    description: reporting unit uuids of the collection items
                    items:
                      type: string
        "400":
          description: Bad Request
        "403":
          $ref: "#/components/responses/Forbidden"
  /mgrsTiles/{id}:
    get:
      operationId: getMgrsTile
      summary: Get List of presigned S3 URLs pointing to the data releated to a
        specific MGRS tile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  data_access_urls:
                    description: Presigned S3 URLs providing access to the data related to the
                      requested MGRS tile
                    items:
                      type: string
        "400":
          description: Bad Request
        "403":
          $ref: "#/components/responses/Forbidden"
  /user:
    post:
      operationId: listUsers
      summary: List users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  users:
                    type: array
                    description: users
                    items:
                      properties:
                        userId:
                          type: string
                          description: user ID number
                          example: 12341234-1234-1234-1234-123412341234
                        email:
                          type: string
                          description: email address
                        nickname:
                          type: string
                          description: The user's preferred name
                        name:
                          type: string
                          description: name
                        given_name:
                          type: string
                          description: The user's given name (first name, in western cultures)
                        family_name:
                          type: string
                          description: The user's family name (last name, in western cultures)
                        organization_name:
                          type: string
                          description: organization name
                        organization_title:
                          type: string
                          description: organization title
                  partial:
                    type: boolean
                    description: True when group membership data is incomplete because one or more
                      Cognito group lookups failed after retries (admin listing
                      only); affected group IDs are listed in failedGroups
                  failedGroups:
                    type: array
                    description: Cognito group names (organization IDs) whose membership lookup
                      failed; only present when partial is true
                    items:
                      type: string
                  groupMissing:
                    type: boolean
                    description: Present and true only when the requested organization exists but
                      its Cognito group does not (data-consistency gap); users
                      is then empty. Omitted on the normal (success) path, and
                      never present on the admin all-users listing
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Temporarily unavailable because Cognito is throttling; retry after
            the delay given in the Retry-After header
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    description: error message
  /invite:
    post:
      operationId: sendInvite
      summary: Invite a user to the Chloris Web Platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              x-public: true
              properties:
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
                token:
                  type: string
                  description: invite token
                  example: 12341234-1234-1234-1234-123412341234
                expires:
                  type: string
                  description: expiration date
                  example: 2020-01-01
                email:
                  type: string
                  description: email address
                  example: example@gmail.com
                name:
                  type: string
                  description: name
                  example: Johnny Appleseed
                role:
                  type: string
                  description: role
                  example: viewer
      responses:
        "200":
          description: Success
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Temporarily unavailable because Cognito is throttling; retry after
            the delay given in the Retry-After header
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    description: error message
  /boundary:
    post:
      operationId: uploadBoundary
      summary: Request a boundary be normalized. Does not automatically create a
        reporting unit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                organizationId:
                  type: string
                  description: organization ID
                  example: 12341234-1234-1234-1234-123412341234
                uploadId:
                  type: string
                  description: Optional identifier for this upload, can be any alphanumeric (plus
                    dash) string up to 64 characters. If not provided, a random
                    UUID7 will be used.
                  example: abcd1234
                uploadPath:
                  type: string
                  description: Path to the boundary file upload, may be a http(s) or S3 path. If
                    upload is a multi-file shapefile, only the .shp file is
                    required.
                  example: https://example.com/path/to/geojson
                excludeGeojsonPath:
                  type: string
                  description: Path to a normalized geojson boundary that should be excluded from
                    the first. Recommended when uploading a control boundary to
                    prevent overlaps.
                  example: s3://path/to/geojson
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  uploadId:
                    type: string
                    description: The upload ID
                    example: abcd1234
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    description: message
                    example: Invalid geojson
                  failedChecks:
                    type: array
                    description: List of failed checks (if any)
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      summary: Get the result of a boundary upload
      operationId: getBoundaryUpload
      parameters:
        - name: uploadId
          in: query
          required: true
          schema:
            type: string
            description: upload ID number
            example: 12341234-1234-1234-1234-123412341234
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                properties:
                  uploadId:
                    type: string
                    description: upload ID number
                    example: 12341234-1234-1234-1234-123412341234
                  boundaryPath:
                    type: string
                    description: boundary path, if normalized successfully
                    example: s3://path/to/boundary
                  error:
                    type: string
                    description: Error message if the boundary could not be normalized.
                    example: Invalid geojson
        "403":
          $ref: "#/components/responses/Forbidden"
  /collection:
    put:
      operationId: putCollection
      summary: Create or update a collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/collectionEntry"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/collectionEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /aoi/submit:
    get:
      operationId: submitAoiToSandbox
      summary: Retrieve stats for an AOI on-the-fly
      parameters:
        - name: data_uri
          in: query
          required: true
          description: S3 URI to the TIF data
          schema:
            type: string
        - name: geometry
          in: query
          required: false
          description: Optional geometry parameter (S3 URI or raw geometry)
          schema:
            type: string
      responses:
        "200":
          description: Job submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data_uri:
                    type: string
                  geometry:
                    type: string
                  result:
                    type: string
        "400":
          description: Bad Request
        "403":
          $ref: "#/components/responses/Forbidden"
  /aoi/healthz:
    get:
      operationId: sandboxHealth
      summary: Health check for sandbox AOI querying service
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                  service:
                    type: string
components:
  schemas:
    organization:
      properties:
        organizationId:
          type: string
          description: organization ID
          example: 12341234-1234-1234-1234-123412341234
        tagOptions:
          type: object
          description: Customization options for tags
        label:
          type: string
          description: label
        description:
          type: string
          description: This is a description of an organization
        massUnitOption:
          type: string
          description: The preferred display unit for mass
          example: t
        areaUnitOption:
          type: string
          description: The preferred display unit for area
          example: ha
        emailFrequencyOption:
          type: string
          description: email frequency option
          example: daily
        webhookUrl:
          type: string
          description: webhook url
          example: https://example.com
        webhookSecret:
          type: string
          description: webhook secret
          example: 12341234-1234-1234-1234-123412341234
    organizationEntry:
      properties:
        organizationId:
          type: string
          description: organization ID
          example: 12341234-1234-1234-1234-123412341234
        tagOptions:
          type: object
          description: Customization options for tags
        label:
          type: string
          description: The name of the organization
        massUnitOption:
          type: string
          description: The preferred display unit for mass
          example: t
        areaUnitOption:
          type: string
          description: The preferred display unit for area
          example: ha
        emailFrequencyOption:
          type: string
          description: Email frequency option for the organization, valid values are
            currently only 'every' and 'never'
          example: never
        webhookUrl:
          type: string
          description: webhook url
          example: https://example.com
        webhookSecret:
          type: string
          description: webhook secret
          example: 12341234-1234-1234-1234-123412341234
    reportingUnit:
      properties:
        organizationId:
          type: string
          description: organization ID
          example: 12341234-1234-1234-1234-123412341234
        reportingUnitId:
          type: string
          description: reporting unit UUID
          example: 12341234-1234-1234-1234-123412341234
        controlReportingUnitId:
          type: string
          description: control reporting unit id
        tags:
          type: array
          description: The list of tags to organize this site into.
          example:
            - tag1
            - tag2
            - tag3
          items:
            type: string
        label:
          type: string
          description: label
        description:
          type: string
          description: This is a description of a reportingUnit
        resolution:
          type: integer
          description: The desired resolution of the outputs. Valid options are 30 and 10
            (meters).
          example: 30
        periodChangeStartYear:
          type: integer
          description: The start of the period of interest
          example: 2000
        periodChangeEndYear:
          type: integer
          description: The end of the period of interest (inclusive)
          example: 2023
        forest:
          type: boolean
          description: Whether or not to generate forest change layers in the analysis.
          example: true
        forestBaselineYear:
          type: integer
          description: The year of the forest baseline (periodChangeStartYear will be used
            if not provided)
          example: 2005
        boundaryPath:
          type: string
          description: boundary path
          example: s3://path/to/boundary
        controlBoundaryPath:
          type: string
          description: control boundary path, only valid for initial creation.
          example: s3://path/to/control/boundary
        mangrove:
          type: boolean
          description: Whether or not to use the mangrove model for in the analysis.
            Defaults to false.
          example: true
    reportingUnitEntry:
      description: A reporting unit entry
      properties:
        organizationId:
          type: string
          description: organization ID
          example: 12341234-1234-1234-1234-123412341234
        reportingUnitId:
          type: string
          description: reporting unit uuid7
          example: 12341234-1234-1234-1234-123412341234
        branchId:
          type: string
          description: If the entry is an aggregate branch (i.e. a tag), this is the
            branch ID
          example: 12341234-1234-1234-1234-123412341234
        controlReportingUnitId:
          type: string
          description: The reporting unit ID of the control site
          example: 12341234-1234-1234-1234-123412341234
        controlForReportingUnitId:
          type: string
          description: The reporting unit ID of the site this is a control for
          example: 12341234-1234-1234-1234-123412341234
        tags:
          description: A list of tags associated with the reporting unit. Acts as a key
            way to organize and aggregate reporting units.
          type: array
          items:
            type: string
            description: A tag associated with the reporting unit, must be URL-safe.
            minLength: 1
            maxLength: 255
            pattern: ^[a-zA-Z0-9:+.\-_ ]+$
        label:
          type: string
          description: The label / name of the reporting unit.
        description:
          type: string
          description: A description of the reporting unit.
        createdAt:
          type: string
          description: When the entry was created (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        updatedAt:
          type: string
          description: When the entry was last updated (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        analysisSubmittedAt:
          type: string
          description: When the entry was submitted for processing (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        analysisCompletedAt:
          type: string
          description: When the entry analysis was lasy updated (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        qualityControlledAt:
          type: string
          description: When the entry was QC approved, without this the analysis is
            considered preliminary and should not be used (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        deletedAt:
          type: string
          description: When the entry was archived (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        refundedAt:
          type: string
          description: When the entry's usage was refunded (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        usersNotifiedAt:
          type: string
          description: When the users were notified the site is ready, only happens once
            (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        webhookNotifiedAt:
          type: string
          description: When the registered webhook was notified successfully last. Can be
            used to recover from dropped webhook events. (ISO8601)
          example: 2024-01-01T00:00:00.000Z
        periodChangeStartYear:
          type: integer
          description: The start of the period of interest
          example: 2020
        periodChangeEndYear:
          type: integer
          description: The end of the period of interest (inclusive)
          example: 2023
        boundaryPath:
          type: string
          description: The path to the geojson boundary for this site
          example: s3://path/to/boundary
        hidden:
          type: boolean
          description: Whether the entry is hidden by default in the frontend and excluded
            from aggregation stats. Useful for control sites.
          example: false
        controlReportingUnit:
          $ref: "#/components/schemas/reportingUnitEntry"
        areaKm2:
          type: number
          description: The vector area of the reporting unit in square kilometers.
        analyzedAreaKm2:
          type: number
          description: The raster area of the reporting unit in square kilometers to be
            used when computing densities.
        pointX:
          type: number
          description: The representative circle X (long) coord, guaranteed to intersect
            the boundary
        pointY:
          type: number
          description: The representative circle Y (lat) coord, guaranteed to intersect
            the boundary
        pointR:
          type: number
          description: The representative circle R coord, such that the circle fully
            contains the boundary
        srcOrganizationId:
          type: string
          description: The organization ID of the source organization for this reporting
            unit, used only if it was copied between environments /
            organizations.
        dataPath:
          type: string
          description: The path to the data files for this reporting unit, used only if it
            was copied between environments / organizations.
        periodChangeStartYearStock:
          type: number
          description: The stock value for the start of the period of interest
        periodChangeStartYearStockError:
          type: number
          description: The stock error for the start of the period of interest
        periodChangeEndYearStock:
          type: number
          description: The stock value for the end of the period of interest
        periodChangeEndYearStockError:
          type: number
          description: The stock error for the end of the period of interest
        periodChange:
          type: number
          description: The change in stock over the period of interest
        periodChangeError:
          type: number
          description: The error in the change in stock over the period of interest
        periodChangePercent:
          type: number
          description: The percent change in stock over the period of interest compared to
            the start.
        periodChangeGain:
          type: number
          description: The gain in stock over the period of interest
        periodChangeGainError:
          type: number
          description: The error in the gain in stock over the period of interest
        periodChangeLoss:
          type: number
          description: The loss in stock over the period of interest
        periodChangeLossError:
          type: number
          description: The error in the loss in stock over the period of interest
        dryrun:
          type: boolean
          description: Whether the entry was created as a dryrun, prevents it from being
            processed and marks it as deletedAt 3 hours in the future.
        createdAsDryrun:
          type: boolean
          description: Present (true) on entries created with dryrun=true, and kept after
            such an entry is restored or approved and becomes a regular entry.
            Absent on entries created without dryrun. Whether an entry is a
            dryrun now is given by analysisStatus and expiresAt.
        calibratedTo:
          type: string
          description: The reporting unit ID of the site this is calibrated to.
          example: 12341234-1234-1234-1234-123412341234
        calibratedFrom:
          type: string
          description: The reporting unit ID of the site this is calibrated from.
          example: 12341234-1234-1234-1234-123412341234
        mangrove:
          type: boolean
          description: Whether or not the reporting unit is a mangrove site.
          example: true
    collectionEntry:
      properties:
        organizationId:
          type: string
          description: organization ID
          example: 12341234-1234-1234-1234-123412341234
        reportingUnitId:
          type: string
          description: reporting unit UUID
          example: 12341234-1234-1234-1234-123412341234
        label:
          type: string
          description: label
        description:
          type: string
          description: This is a description of a reportingUnit
        reportingUnitIds:
          type: array
